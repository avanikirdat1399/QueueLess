
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QueueLess | Student Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-slate-950 text-white min-h-screen">

    <!-- Navigation -->
    <nav class="flex justify-between items-center px-8 py-5 border-b border-slate-800">

        <h1 class="text-2xl font-bold text-blue-400">
            QueueLess<span class="text-white">.</span>
        </h1>

        <button onclick="logout()"
            class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg">
            Logout
        </button>

    </nav>


    <!-- Welcome Section -->
    <section class="max-w-6xl mx-auto px-6 py-12">

        <h2 class="text-3xl md:text-4xl font-bold">
            Welcome, <span id="student-name" class="text-blue-400">Student</span>!
        </h2>

        <p class="text-slate-400 mt-3">
            Choose a college service and generate your digital queue token.
        </p>


        <!-- Available Services -->
        <div class="mt-12">

            <h3 class="text-2xl font-bold mb-7">
                Available Services
            </h3>

            <div id="service-container"
                class="grid grid-cols-1 md:grid-cols-3 gap-7">

                <p class="text-slate-400">
                    Loading services...
                </p>

            </div>

        </div>


        <!-- Current Token -->
        <div class="mt-14 bg-slate-900 border border-slate-800 rounded-xl p-7">

            <h3 class="text-2xl font-bold">
                My Current Token
            </h3>

            <div id="current-token" class="mt-5 text-slate-400">

                <p>You don't have an active token yet.</p>

            </div>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="/static/js/dashboard.js"></script>

</body>

</html>
